services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      DB_PATH: /app/data/wordtrace.db
      DAILY_GOAL: ${DAILY_GOAL:-20}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    volumes:
      - wordtrace-data:/app/data
    networks:
      - wordtrace
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - wordtrace

volumes:
  wordtrace-data:

networks:
  wordtrace:
